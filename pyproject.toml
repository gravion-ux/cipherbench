[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherbench"
version = "0.1.0"
description = "A benchmark and interoperability test harness specification for vetted post-quantum cryptographic providers."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cipherbench = "cipherbench.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
